services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barracar
      POSTGRES_USER: barracar
      POSTGRES_PASSWORD: barracar_local
    ports: [ "5432:5432" ]
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U barracar" ]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: barracar
      MINIO_ROOT_PASSWORD: troque-esta-chave-local
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio_data:/data" ]
  minio-init:
    image: minio/mc:latest
    depends_on: [ minio ]
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "until mc alias set local http://minio:9000 barracar troque-esta-chave-local; do sleep 2; done; mc mb --ignore-existing local/barracar-private; mc anonymous set none local/barracar-private" ]
volumes:
  postgres_data:
  minio_data:
